name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - name: Installed package smoke outside checkout
        working-directory: /tmp
        run: python -c 'import ps_emu; from ps_emu.resources import example_profile; from ps_emu.provenance import source_identity; assert example_profile("server.toml").is_file(); assert source_identity()["package_name"] == "ps-emu"'
